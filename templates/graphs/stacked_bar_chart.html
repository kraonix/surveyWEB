<div class="viz-tile dynamic-tile">
    <h2>{{ title }}</h2>

    <div style="width:100%; height:420px; position:relative;">
        <canvas id="stackedBarChart"></canvas>
    </div>

    <script>
        if (window.currentChart) {
            window.currentChart.destroy();
        }

        var ctx = document.getElementById("stackedBarChart");

        window.currentChart = new Chart(ctx, {
            type: "bar",
            data: {
                labels: {{ labels | tojson }},
                datasets: {{ datasets | tojson }}
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        labels: { color: "white" }
                    }
                },
                scales: {
                    x: {
                        stacked: true,
                        ticks: { color: "white" }
                    },
                    y: {
                        stacked: true,
                        ticks: { color: "white" },
                        beginAtZero: true,
                        title: {
                            display: true,
                            text: 'Count',
                            color: 'white'
                        }
                    }
                }
            }
        });
    </script>
</div>
