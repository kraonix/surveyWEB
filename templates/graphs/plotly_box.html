<div class="viz-tile dynamic-tile">

    <h2 style="color:white;">{{ title }}</h2>

    <div id="plotArea" style="width:100%; height:450px;"></div>

    <script>
        var data = {{ plot_data | tojson }};

        var layout = {
            paper_bgcolor: 'rgba(0,0,0,0)',
            plot_bgcolor: 'rgba(0,0,0,0)',
            font: { color: 'white' },

            xaxis: {
                title: "Accommodation Type",
                tickangle: -19,
                tickfont: { size: 9 },
            },

            yaxis: {
                title: "Monthly Rent (₹)",
                zeroline: false,
                gridcolor: "rgba(255,255,255,0.25)"
            },

            margin: { t: 40, l: 60, r: 40, b: 100 },
            showlegend: false
        };

        var config = {
            responsive: true,
            displaylogo: false,
            modeBarButtonsToRemove: [
                "zoom2d", "pan2d", "select2d", "lasso2d",
                "zoomIn2d", "zoomOut2d", "autoScale2d", "resetScale2d"
            ],
            displayModeBar: false
        };

        Plotly.newPlot("plotArea", data, layout, config);
    </script>

</div>
