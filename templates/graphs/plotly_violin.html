<div class="viz-tile dynamic-tile">

    <h2 style="color:white;">{{ title }}</h2>

    <div id="plotArea" style="width:100%; height:450px;"></div>

    <script>
        if (window.currentChart) {
            window.currentChart = null;
        }

        var data = {{ plot_data | tojson }};

        const layout = {
            paper_bgcolor: 'rgba(0,0,0,0)',
            plot_bgcolor: 'rgba(0,0,0,0)',
            font: { color: 'white' },
            xaxis: { title: "Accommodation Type", showgrid: false },
            yaxis: { title: "Monthly Rent (₹)" },
            margin: { t: 40, l: 60, r: 20, b: 60 }
        };

        Plotly.newPlot("plotArea", data, layout, { responsive: true });
    </script>

</div>
